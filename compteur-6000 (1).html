<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Compteur 6000</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#eceef1;--card:#ffffff;--text:#16181c;--muted:#7b818b;--line:#d9dde3;
  --accent:#d7263d;--accent-ink:#ffffff;--soft:#fde8ea;--ok:#1d8a4e;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121418;--card:#1c1f25;--text:#eef0f3;--muted:#8d939e;--line:#323741;
    --accent:#ff4d5e;--accent-ink:#ffffff;--soft:#3a1e23;--ok:#4cc380;
  }
}
:root[data-theme="dark"]{
  --bg:#121418;--card:#1c1f25;--text:#eef0f3;--muted:#8d939e;--line:#323741;
  --accent:#ff4d5e;--accent-ink:#ffffff;--soft:#3a1e23;--ok:#4cc380;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;width:100%}

/* Onglets */
.tabs{flex:none;display:flex;gap:6px;padding:6px 8px 4px}
.tab{flex:1;min-height:44px;border:1px solid var(--line);background:var(--card);border-radius:10px;font-weight:600;color:var(--muted)}
.tab.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* Écrans défilants */
.screen{flex:1;min-height:0;overflow-y:auto;padding:8px 10px 16px}
h1{font-size:26px;margin:6px 0 2px;display:flex;align-items:center;gap:10px}
h1 .die{width:34px;height:34px;border-radius:8px;background:var(--accent);display:inline-grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:6px;gap:2px}
h1 .die i{background:#fff;border-radius:50%}
h2{font-size:17px;margin:18px 0 8px}
.sub{color:var(--muted);margin:0 0 12px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.row{display:flex;align-items:center;gap:8px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper .n{font:700 28px var(--mono);min-width:34px;text-align:center}
.sq{min-width:44px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);font:700 22px var(--mono)}
.name-in{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);padding:0 12px;font-size:16px;margin-top:8px}
.name-in:focus{outline:2px solid var(--accent);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--card);font-weight:600;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.big{width:100%;min-height:52px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:18px;margin-top:14px}
.ghost{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;margin-top:8px}
.ghost.red{color:var(--accent);border-color:var(--accent)}
details.rules{margin-top:12px}
details.rules summary{min-height:44px;display:flex;align-items:center;font-weight:600;cursor:pointer}
details.rules ul{margin:4px 0 0;padding-left:18px;font-size:14px}
details.rules li{margin:4px 0}

/* Jeu */
.game{flex:1;min-height:0;display:flex;flex-direction:column}
.msg{flex:none;padding:3px 12px;font-size:13px;min-height:40px;display:flex;flex-direction:column;justify-content:center;gap:1px}
.msg .l2{color:var(--accent);font-weight:600}
.tiles{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:4px 8px 6px;display:grid;grid-template-columns:repeat(var(--c),minmax(0,1fr));gap:6px;align-content:start}
.tile{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:6px 6px 5px;min-width:0}
.tile.act{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tile.dq{opacity:.55}
.nm{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{font-size:11px;height:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st.hot{color:var(--accent);font-weight:700}
.sc{font:700 26px/1.1 var(--mono);letter-spacing:-.5px}
.c4 .sc{font-size:19px}
.c4 .nm{font-size:12px}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin:3px 0 2px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.gap{font:600 11px/14px var(--mono);height:14px;color:var(--muted)}
.gap.up{color:var(--accent)}
.hist{font:11px/13px var(--mono);height:104px;overflow:hidden;margin-top:2px}
.hist div{height:13px;white-space:nowrap}
.hist div:first-child{font-weight:700}
.b{color:var(--accent);font-weight:700}
.g{color:var(--muted);opacity:.75}
.x{text-decoration:line-through;color:var(--muted)}

.pad{flex:none;padding:6px 8px 8px;border-top:1px solid var(--line);background:var(--bg)}
.disp{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:0 6px 5px}
.disp .who{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.disp .val{font:700 30px/1.1 var(--mono)}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.k{min-height:44px;border:1px solid var(--line);background:var(--card);border-radius:10px;font:600 19px var(--mono);user-select:none;-webkit-user-select:none;padding:0}
.k:active{transform:scale(.96)}
.k.s{color:var(--accent);font-size:16px}
.k.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font:700 17px system-ui,sans-serif}
.k.out{color:var(--accent);border-color:var(--accent);font-weight:700}
.k.txt{font:600 15px system-ui,sans-serif}
.k.w2{grid-column:span 2}
.k:disabled{opacity:.4}

/* Résultat */
.win{text-align:center;padding:18px 10px 10px}
.win .trophy{font-size:46px}
.win .who{font-size:28px;font-weight:800;margin:4px 0}
.win .why{color:var(--muted);font-size:14px}
.rank{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.rank:last-child{border-bottom:0}
.rank .pos{font:700 16px var(--mono);width:22px;color:var(--muted)}
.rank .n{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .s{font:700 20px var(--mono)}

/* Stats */
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:600;color:var(--muted);text-align:right;padding:6px 4px;font-size:12px}
th:first-child,td:first-child{text-align:left}
td{padding:9px 4px;border-top:1px solid var(--line);text-align:right;font-family:var(--mono)}
td:first-child{font-family:inherit;font-weight:600;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.kpi b{display:block;font:700 18px var(--mono)}
.kpi span{font-size:12px;color:var(--muted)}
.gm{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;gap:8px;align-items:flex-start}
.gm .in{flex:1;min-width:0}
.gm .d{font-size:12px;color:var(--muted)}
.gm .w{font-weight:700;margin:2px 0}
.gm .sc2{font:13px/1.5 var(--mono);word-break:break-word}
.del{min-width:44px;min-height:44px;border:1px solid var(--line);background:var(--bg);border-radius:10px;font-size:18px;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:22px 10px;font-size:14px}

/* Modale + toast */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.dlg{background:var(--card);border-radius:16px;padding:18px;max-width:380px;width:100%;border:1px solid var(--line)}
.dlg h3{margin:0 0 6px;font-size:18px}
.dlg p{margin:0 0 14px;color:var(--muted);font-size:14px}
.dlg .btns{display:flex;gap:8px}
.dlg .btns button{flex:1;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:600}
.dlg .btns .ok{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:22px;font-weight:600;font-size:14px;z-index:20;max-width:90%}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
"use strict";
var KEY='compteur-6000-v1', GOAL=6000, ENTRY=600;

/* ---------- Stockage ---------- */
function def(){return {saved:[],game:null,setup:{count:3,names:['','','','','',''],first:-1},tab:'game'};}
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){var o=JSON.parse(raw);var d=def();for(var k in d){if(o&&o[k]!==undefined)d[k]=o[k];}return d;}
  }catch(e){}
  return def();
}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
var S=load();
var inputVal='', flash='', modal=null;

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

/* ---------- Moteur : rejoue la partie depuis l'historique ---------- */
function replay(g){
  var names=g.names, n=names.length;
  var P=names.map(function(){return {score:0,stack:[],entries:[],streak:0,sixes:0,dq:false,reach:null,turns:0,points:0};});
  var trigger=null, pending=new Set(), over=false, winner=-1, reason='', lastEv=[], cur=g.first;

  function entered(i){return P[i].stack.length>0;}
  function pop(i){
    var t=P[i].stack.pop(); if(t)t.entry.cancelled=true;
    var top=P[i].stack[P[i].stack.length-1];
    P[i].score=top?top.score:0;
  }
  function arrive(i,ev){
    if(P[i].score<=0)return;
    for(var j=0;j<n;j++){
      if(j!==i&&!P[j].dq&&P[j].score===P[i].score){
        pop(j);
        ev.push('Égalité : '+names[j]+' retombe à '+P[j].score+'.');
        arrive(j,ev);
      }
    }
  }
  function next(p){
    for(var k=1;k<=n;k++){
      var j=(p+k)%n;
      if(!P[j].dq&&(trigger===null||pending.has(j)))return j;
    }
    return -1;
  }

  for(var ti=0;ti<g.turns.length&&!over;ti++){
    var p=g.turns[ti].p, v=g.turns[ti].v, pl=P[p], ev=[], e;
    pl.turns++;
    if(typeof v==='number'){
      pl.points+=v;
      e={v:v,kind:'n',counted:false,cancelled:false}; pl.entries.push(e);
      if(!entered(p)){
        if(v>=ENTRY){
          e.counted=true; pl.score=v; pl.stack.push({score:v,entry:e});
          ev.push(names[p]+' entre en jeu avec '+v+' !');
        }else{
          ev.push(names[p]+' : '+v+', pas compté (il faut '+ENTRY+' pour entrer).');
        }
      }else{
        e.counted=true; pl.score+=v; pl.stack.push({score:pl.score,entry:e});
        ev.push(names[p]+' : +'+v+'.');
      }
      pl.streak=0;
      if(e.counted)arrive(p,ev);
    }else{
      e={v:v,kind:'b',counted:entered(p),cancelled:false}; pl.entries.push(e);
      if(!e.counted){
        ev.push(names[p]+' : bulle avant l\u2019entrée, elle ne compte pas.');
      }else{
        pl.streak++; if(v==='B')pl.sixes++;
        ev.push(names[p]+' : bulle'+(v==='B'?' sur 6 dés':'')+' ('+pl.streak+'/3'+(v==='B'?', ø6 '+pl.sixes+'/3':'')+').');
        if(pl.streak>=3){
          pop(p); pl.streak=0;
          ev.push('3 bulles : '+names[p]+' revient à '+pl.score+'.');
          arrive(p,ev);
        }
        if(pl.sixes>=3){
          pl.dq=true; pending.delete(p);
          ev.push(names[p]+' est disqualifié (3 ø6).');
        }
      }
    }
    P.forEach(function(q){
      if(q.score>=GOAL){if(q.reach===null)q.reach=ti;}else q.reach=null;
    });
    if(trigger===null){
      if(!pl.dq&&pl.score>=GOAL){
        trigger=p; pending=new Set();
        for(var j=0;j<n;j++)if(j!==p&&!P[j].dq)pending.add(j);
        ev.push(names[p]+' atteint '+GOAL+' ! Dernier tour pour les autres : il faut dépasser '+pl.score+'.');
      }
    }else{
      pending.delete(p);
    }
    var act=[]; for(var a=0;a<n;a++)if(!P[a].dq)act.push(a);
    if(n>1&&act.length===1){
      over=true; winner=act[0]; reason='last';
    }else if(trigger!==null&&pending.size===0){
      var best=-1;
      act.forEach(function(j){
        if(best<0||P[j].score>P[best].score||
          (P[j].score===P[best].score&&(P[j].reach===null?1e9:P[j].reach)<(P[best].reach===null?1e9:P[best].reach)))best=j;
      });
      if(best>=0&&P[best].score>=GOAL){over=true;winner=best;reason='score';}
      else{trigger=null;ev.push('Plus personne n\u2019est à '+GOAL+' : la partie continue.');}
    }
    lastEv=ev;
    if(!over)cur=next(p);
  }
  return {P:P,cur:cur,trigger:trigger,over:over,winner:winner,reason:reason,lastEv:lastEv};
}

/* ---------- Utilitaires ---------- */
function fmtDur(ms){
  var s=Math.round(ms/1000), h=Math.floor(s/3600), m=Math.floor((s%3600)/60), r=s%60;
  var p2=function(x){return (x<10?'0':'')+x;};
  return h>0?h+' h '+p2(m)+' min':m+':'+p2(r);
}
function fmtDate(ts){
  try{return new Date(ts).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}
  catch(e){return '';}
}
function toast(t){
  var d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);
  setTimeout(function(){if(d.parentNode)d.parentNode.removeChild(d);},2200);
}
function askConfirm(title,text,okLabel,fn){modal={title:title,text:text,ok:okLabel,fn:fn};render();}

/* ---------- Rendu ---------- */
var root=document.getElementById('app');

function render(){
  var body;
  if(S.tab==='stats')body=renderStats();
  else if(!S.game)body=renderSetup();
  else{
    var r=replay(S.game);
    body=r.over?renderResult(r):renderPlay(r);
  }
  var tabs='<div class="tabs"><button class="tab'+(S.tab==='game'?' on':'')+'" data-a="tab" data-v="game">Partie</button>'+
    '<button class="tab'+(S.tab==='stats'?' on':'')+'" data-a="tab" data-v="stats">Stats</button></div>';
  var mo='';
  if(modal){
    mo='<div class="ov"><div class="dlg"><h3>'+esc(modal.title)+'</h3><p>'+esc(modal.text)+'</p><div class="btns">'+
      '<button data-a="mno">Annuler</button><button class="ok" data-a="mok">'+esc(modal.ok)+'</button></div></div></div>';
  }
  root.innerHTML=tabs+body+mo;
  var t=root.querySelector('.tile.act'); if(t&&t.scrollIntoView)t.scrollIntoView({block:'nearest'});
}

function renderSetup(){
  var s=S.setup, n=s.count, i, h='<div class="screen">';
  h+='<h1><span class="die"><i></i><i style="visibility:hidden"></i><i></i><i style="visibility:hidden"></i><i></i><i style="visibility:hidden"></i><i></i><i style="visibility:hidden"></i><i></i></span>Compteur 6000</h1>';
  h+='<p class="sub">6 dés, premier à 6000 points.</p>';
  h+='<div class="card"><div class="row" style="justify-content:space-between"><b>Joueurs</b><div class="stepper">'+
    '<button class="sq" data-a="count" data-v="-1" aria-label="Moins de joueurs">−</button><span class="n">'+n+'</span>'+
    '<button class="sq" data-a="count" data-v="1" aria-label="Plus de joueurs">+</button></div></div>';
  for(i=0;i<n;i++){
    h+='<input class="name-in" data-i="'+i+'" maxlength="16" placeholder="Joueur '+(i+1)+'" value="'+esc(s.names[i]||'')+'" aria-label="Nom du joueur '+(i+1)+'">';
  }
  h+='</div>';
  h+='<h2>Qui commence ?</h2><div class="card"><div class="chips">'+
    '<button class="chip'+(s.first<0||s.first>=n?' on':'')+'" data-a="first" data-v="-1">Tirage au sort</button>';
  for(i=0;i<n;i++){
    h+='<button class="chip'+(s.first===i?' on':'')+'" data-a="first" data-v="'+i+'" id="fc'+i+'">'+esc(s.names[i]||'Joueur '+(i+1))+'</button>';
  }
  h+='</div></div>';
  h+='<button class="big" data-a="start">Commencer</button>';
  h+='<details class="rules"><summary>Rappel des règles</summary><ul>'+
    '<li><b>Barème :</b> 1 = 100, 5 = 50, brelan = valeur × 100, brelan de 1 = 1000, pas de carré, trois doubles = 1500, grande suite = 3000.</li>'+
    '<li><b>Entrée :</b> au moins 600 points en un seul tour. Avant, les tours sous 600 et les bulles ne comptent pas.</li>'+
    '<li><b>Bulle (ø) :</b> un raté. 3 bulles d\u2019affilée annulent le dernier score compté.</li>'+
    '<li><b>Bulle ø6 :</b> raté sur un lancer de 6 dés. 3 ø6 dans la partie : disqualifié.</li>'+
    '<li><b>Égalité :</b> arriver sur le score d\u2019un autre (au-dessus de 0) le fait retomber à son score précédent.</li>'+
    '<li><b>Fin :</b> à 6000, les autres jouent un dernier tour et doivent dépasser ce score. Le plus haut score gagne.</li>'+
    '</ul></details></div>';
  return h;
}

function entryHtml(e){
  var t=e.kind==='n'?'+'+e.v:(e.v==='B'?'ø6':'ø');
  if(e.kind==='n'){
    if(!e.counted)return '<div class="g">'+t+'</div>';
    if(e.cancelled)return '<div class="x">'+t+'</div>';
    return '<div>'+t+'</div>';
  }
  return e.counted?'<div class="b">'+t+'</div>':'<div class="g">'+t+'</div>';
}

function renderPlay(r){
  var g=S.game, n=g.names.length, P=r.P, cur=r.cur, i;
  var cols=n<=3?n:(n===4?4:3);
  var h='<div class="game">';
  var l1=flash||(r.lastEv.length?r.lastEv.join(' '):(g.note||('À '+g.names[cur]+' de jouer.')));
  h+='<div class="msg"><div>'+esc(l1)+'</div>';
  if(r.trigger!==null)h+='<div class="l2">Dernier tour : il faut dépasser '+P[r.trigger].score+'.</div>';
  h+='</div>';
  h+='<div class="tiles c'+cols+'" style="--c:'+cols+'">';
  for(i=0;i<n;i++){
    var q=P[i], st='', hot=false;
    if(q.dq)st='Disqualifié';
    else if(r.trigger===i&&q.score>=GOAL){st='À battre';hot=true;}
    else if(q.stack.length===0)st='Pas entré';
    var gap='',gcls='gap';
    if(i!==cur&&!q.dq){
      var d=q.score-P[cur].score;
      if(d>0){gap='▲ '+d;gcls+=' up';}else if(d<0)gap='▼ '+(-d);else gap='= égalité';
    }
    var pct=Math.min(100,q.score/GOAL*100);
    h+='<div class="tile'+(i===cur?' act':'')+(q.dq?' dq':'')+'">'+
      '<div class="nm">'+esc(g.names[i])+'</div>'+
      '<div class="st'+(hot?' hot':'')+'">'+st+'</div>'+
      '<div class="sc">'+q.score+'</div>'+
      '<div class="bar"><i style="width:'+pct+'%"></i></div>'+
      '<div class="'+gcls+'">'+gap+'</div>'+
      '<div class="hist">'+q.entries.slice(-8).reverse().map(entryHtml).join('')+'</div></div>';
  }
  h+='</div>';
  h+='<div class="pad"><div class="disp"><span class="who">Tour de '+esc(g.names[cur])+'</span><span class="val" id="val">'+(inputVal||'0')+'</span></div>'+
    '<div class="keys">'+
    ['7','8','9'].map(dk).join('')+sk(50)+
    ['4','5','6'].map(dk).join('')+sk(100)+
    ['1','2','3'].map(dk).join('')+sk(500)+
    '<button class="k" data-a="del" aria-label="Effacer">⌫</button>'+dk('0')+dk('00')+sk(1000)+
    '<button class="k main w2" data-a="add">Ajouter</button>'+
    '<button class="k out txt" data-a="b">Bulle ø</button><button class="k out txt" data-a="B">Bulle ø6</button>'+
    '<button class="k txt w2" data-a="undo"'+(g.turns.length?'':' disabled')+'>Annuler</button>'+
    '<button class="k txt w2" data-a="quit">Quitter</button>'+
    '</div></div></div>';
  return h;
}
function dk(d){return '<button class="k" data-a="digit" data-v="'+d+'">'+d+'</button>';}
function sk(v){return '<button class="k s" data-a="sc" data-v="'+v+'">+'+v+'</button>';}

function renderResult(r){
  var g=S.game, P=r.P, n=g.names.length, i;
  var dur=(g.endedAt||Date.now())-g.startedAt;
  var order=[];for(i=0;i<n;i++)order.push(i);
  order.sort(function(a,b){
    if(P[a].dq!==P[b].dq)return P[a].dq?1:-1;
    if(P[b].score!==P[a].score)return P[b].score-P[a].score;
    return (P[a].reach===null?1e9:P[a].reach)-(P[b].reach===null?1e9:P[b].reach);
  });
  var h='<div class="screen"><div class="win"><div class="trophy">🏆</div><div class="who">'+esc(g.names[r.winner])+'</div>'+
    '<div class="why">'+(r.reason==='last'?'gagne : tous les autres sont disqualifiés.':'gagne avec '+P[r.winner].score+' points.')+' Durée : '+fmtDur(dur)+'</div></div>';
  h+='<div class="card">';
  order.forEach(function(j,k){
    h+='<div class="rank"><span class="pos">'+(k+1)+'</span><span class="n">'+esc(g.names[j])+(P[j].dq?' (disqualifié)':'')+'</span><span class="s">'+P[j].score+'</span></div>';
  });
  h+='</div>';
  h+='<button class="big" data-a="save">Enregistrer la partie</button>'+
    '<button class="ghost" data-a="undoend">Annuler le dernier tour</button>'+
    '<button class="ghost red" data-a="discard">Quitter sans enregistrer</button></div>';
  return h;
}

function renderStats(){
  var saved=S.saved||[], h='<div class="screen">';
  if(!saved.length){
    return h+'<div class="empty">Aucune partie enregistrée.<br>Terminez une partie puis touchez « Enregistrer la partie » pour voir vos statistiques ici.</div></div>';
  }
  var map={};
  saved.forEach(function(gm){
    gm.players.forEach(function(p){
      var k=p.name.trim().toLowerCase();
      var o=map[k]||(map[k]={name:p.name,games:0,wins:0,turns:0,points:0});
      o.games++; if(gm.winner===p.name)o.wins++; o.turns+=p.turns; o.points+=p.points;
    });
  });
  var list=Object.keys(map).map(function(k){return map[k];});
  list.sort(function(a,b){
    var ra=a.wins/a.games, rb=b.wins/b.games;
    return b.wins-a.wins||rb-ra||a.name.localeCompare(b.name);
  });
  h+='<h2 style="margin-top:6px">Classement</h2><div class="card" style="padding:4px 10px"><table><thead><tr><th>Joueur</th><th>Parties</th><th>Vict.</th><th>Taux</th><th>Moy./tour</th></tr></thead><tbody>';
  list.forEach(function(o){
    h+='<tr><td>'+esc(o.name)+'</td><td>'+o.games+'</td><td>'+o.wins+'</td><td>'+Math.round(o.wins/o.games*100)+' %</td><td>'+(o.turns?Math.round(o.points/o.turns):'–')+'</td></tr>';
  });
  h+='</tbody></table></div>';
  var durs=saved.map(function(x){return x.dur;}).filter(function(d){return d>0;});
  h+='<h2>Durée des parties</h2><div class="kpis">';
  if(durs.length){
    var avg=durs.reduce(function(a,b){return a+b;},0)/durs.length;
    h+='<div class="kpi"><b>'+fmtDur(avg)+'</b><span>moyenne</span></div>'+
       '<div class="kpi"><b>'+fmtDur(Math.min.apply(null,durs))+'</b><span>plus courte</span></div>'+
       '<div class="kpi"><b>'+fmtDur(Math.max.apply(null,durs))+'</b><span>plus longue</span></div>';
  }
  h+='</div><h2>Dernières parties</h2>';
  saved.slice(0,30).forEach(function(gm){
    var sc=gm.players.map(function(p){return esc(p.name)+' '+p.score+(p.dq?' (disq.)':'');}).join(' · ');
    h+='<div class="gm"><div class="in"><div class="d">'+fmtDate(gm.ts)+' · '+fmtDur(gm.dur)+'</div>'+
      '<div class="w">🏆 '+esc(gm.winner)+'</div><div class="sc2">'+sc+'</div></div>'+
      '<button class="del" data-a="delgame" data-v="'+gm.id+'" aria-label="Supprimer la partie">🗑</button></div>';
  });
  return h+'</div>';
}

/* ---------- Actions ---------- */
function updVal(){var el=document.getElementById('val');if(el)el.textContent=inputVal||'0';}

function addTurn(v){
  var g=S.game; if(!g)return;
  var r=replay(g); if(r.over)return;
  if(typeof v==='number'){
    if(!(v>0)){flash='Saisissez un score supérieur à 0.';render();return;}
    if(v%50!==0){flash='Le score doit être un multiple de 50.';render();return;}
  }
  g.turns.push({p:r.cur,v:v});
  var r2=replay(g);
  if(r2.over&&!g.endedAt)g.endedAt=Date.now();
  inputVal=''; flash=''; g.note='';
  persist(); render();
}

function start(){
  var s=S.setup, n=s.count, names=[], i;
  for(i=0;i<n;i++)names.push((s.names[i]||'').trim()||('Joueur '+(i+1)));
  var first=s.first, note='';
  if(first<0||first>=n){first=Math.floor(Math.random()*n);note='Tirage au sort : '+names[first]+' commence.';}
  else note=names[first]+' commence.';
  S.game={names:names,first:first,turns:[],startedAt:Date.now(),endedAt:null,note:note};
  inputVal='';flash='';S.tab='game';persist();render();
}

function saveGame(){
  var g=S.game,r=replay(g);if(!r.over)return;
  var rec={id:Date.now()+'-'+Math.floor(Math.random()*1000),ts:g.startedAt,dur:(g.endedAt||Date.now())-g.startedAt,
    winner:g.names[r.winner],
    players:g.names.map(function(nm,i){return {name:nm,score:r.P[i].score,dq:r.P[i].dq,turns:r.P[i].turns,points:r.P[i].points};})};
  S.saved.unshift(rec); if(S.saved.length>200)S.saved.length=200;
  S.game=null;S.tab='stats';persist();render();toast('Partie enregistrée');
}

root.addEventListener('click',function(ev){
  var el=ev.target.closest?ev.target.closest('[data-a]'):null; if(!el)return;
  var a=el.getAttribute('data-a'), v=el.getAttribute('data-v'), g=S.game;
  switch(a){
    case 'tab': S.tab=v;persist();render();break;
    case 'count': S.setup.count=Math.max(2,Math.min(6,S.setup.count+Number(v)));
      if(S.setup.first>=S.setup.count)S.setup.first=-1; persist();render();break;
    case 'first': S.setup.first=Number(v);persist();render();break;
    case 'start': start();break;
    case 'digit': if(inputVal.length+v.length<=5){inputVal=(inputVal+v).replace(/^0+/,'');updVal();}break;
    case 'del': inputVal=inputVal.slice(0,-1);updVal();break;
    case 'sc': inputVal=String(Math.min(99999,(Number(inputVal)||0)+Number(v)));updVal();break;
    case 'add': addTurn(Number(inputVal)||0);break;
    case 'b': addTurn('b');break;
    case 'B': addTurn('B');break;
    case 'undo': if(g&&g.turns.length){g.turns.pop();g.endedAt=null;g.note='';inputVal='';flash='Dernier tour annulé.';persist();render();}break;
    case 'undoend': if(g&&g.turns.length){g.turns.pop();g.endedAt=null;flash='Dernier tour annulé.';persist();render();}break;
    case 'quit': askConfirm('Quitter la partie ?','La partie en cours sera perdue, sans être enregistrée.','Quitter',function(){S.game=null;inputVal='';flash='';persist();});break;
    case 'discard': askConfirm('Quitter sans enregistrer ?','Cette partie n\u2019apparaîtra pas dans les stats.','Quitter',function(){S.game=null;persist();});break;
    case 'save': saveGame();break;
    case 'delgame': askConfirm('Supprimer cette partie ?','Elle sera retirée des statistiques.','Supprimer',function(){
        S.saved=S.saved.filter(function(x){return x.id!==v;});persist();});break;
    case 'mno': modal=null;render();break;
    case 'mok': var f=modal&&modal.fn;modal=null;if(f)f();render();break;
  }
});
root.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.classList&&t.classList.contains('name-in')){
    var i=Number(t.getAttribute('data-i'));
    S.setup.names[i]=t.value; persist();
    var c=document.getElementById('fc'+i); if(c)c.textContent=t.value.trim()||('Joueur '+(i+1));
  }
});

render();
})();
</script>
</body>
</html>
